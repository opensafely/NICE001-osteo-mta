version: '5.0'

actions:
  generate_dataset:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py --test-data-file analysis/test_dataset_definition.py --output output/dataset.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/dataset.csv.gz

  select_hip_index_event:
    run: python:v2 python analysis/select_hip_index_event.py
    needs: [generate_dataset]
    outputs:
      highly_sensitive:
        selected_cases: output/selected_hip_index_cases.csv
        selection_qa: output/selected_hip_index_cases_qa.csv

  check_hip_index_selection:
    run: python:v2 python analysis/check_hip_index_selection.py
    needs:
      - generate_dataset
      - select_hip_index_event
    outputs:
      highly_sensitive:
        selection_check: output/hip_index_selection_check.txt

  generate_wrist_candidates:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_wrist.py --test-data-file analysis/test_dataset_definition_wrist.py --output output/wrist_candidates.csv.gz
    outputs:
      highly_sensitive:
        wrist_candidates: output/wrist_candidates.csv.gz

  select_wrist_index_event:
    run: python:v2 python analysis/select_wrist_index_event.py
    needs: [generate_wrist_candidates]
    outputs:
      highly_sensitive:
        selected_cases: output/selected_wrist_index_cases.csv
        selection_qa: output/selected_wrist_index_cases_qa.csv

  check_wrist_index_selection:
    run: python:v2 python analysis/check_wrist_index_selection.py
    needs:
      - generate_wrist_candidates
      - select_wrist_index_event
    outputs:
      highly_sensitive:
        selection_check: output/wrist_index_selection_check.txt

  generate_vertebral_candidates:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_vertebral.py --test-data-file analysis/test_dataset_definition_vertebral.py --output output/vertebral_candidates.csv.gz
    outputs:
      highly_sensitive:
        vertebral_candidates: output/vertebral_candidates.csv.gz

  select_vertebral_index_event:
    run: python:v2 python analysis/select_vertebral_index_event.py
    needs: [generate_vertebral_candidates]
    outputs:
      highly_sensitive:
        selected_cases: output/selected_vertebral_index_cases.csv
        selection_qa: output/selected_vertebral_index_cases_qa.csv

  check_vertebral_index_selection:
    run: python:v2 python analysis/check_vertebral_index_selection.py
    needs:
      - generate_vertebral_candidates
      - select_vertebral_index_event
    outputs:
      highly_sensitive:
        selection_check: output/vertebral_index_selection_check.txt

  generate_prox_humerus_candidates:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_prox_humerus.py --test-data-file analysis/test_dataset_definition_prox_humerus.py --output output/prox_humerus_candidates.csv.gz
    outputs:
      highly_sensitive:
        prox_humerus_candidates: output/prox_humerus_candidates.csv.gz

  select_prox_humerus_index_event:
    run: python:v2 python analysis/select_prox_humerus_index_event.py
    needs: [generate_prox_humerus_candidates]
    outputs:
      highly_sensitive:
        selected_cases: output/selected_prox_humerus_index_cases.csv
        selection_qa: output/selected_prox_humerus_index_cases_qa.csv

  check_prox_humerus_index_selection:
    run: python:v2 python analysis/check_prox_humerus_index_selection.py
    needs:
      - generate_prox_humerus_candidates
      - select_prox_humerus_index_event
    outputs:
      highly_sensitive:
        selection_check: output/prox_humerus_index_selection_check.txt
